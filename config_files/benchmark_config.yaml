# ==========================================
# BENCHMARK CONFIGURATION
# ==========================================

# Base directory where all benchmark outputs (plots, metrics) will be saved
results_base_dir: './benchmark/results'
#results_predictions_dir: './benchmark/results/predictions'

datasets:
  toy:
    type: 'toy'
    shape_name: 'None'
    origin_dir: './datasets/toy_example'
    trajectory_number: 7
    test_id: 0
    r2_letter: "J"
    s2_letter: "C"
    # Preprocessing params for benchmark generation
    interpolation_points: 500
    min_window: 100
    max_window: 490
    samples_per_path: 500
    time_steps: 100
    # Benchmark-specific save paths (dynamically replaces {beta}): the latent
    # ground truth is encoded with one VAE, so every beta_scale gets its own file
    benchmark_dir: './benchmark/data/toy_beta_scale_{beta}'
    gt_data: './benchmark/data/toy_beta_scale_{beta}/ground_truth.pt'

  lasa:
    type: 'lasa'
    shape_name: '{shape}'
    origin_dir: './datasets/lasa'
    origin_file: '{shape}_UQ.mat'
    trajectory_number: 7
    # Preprocessing params for benchmark generation
    min_window: 100
    max_window: 980
    samples_per_path: 50
    time_steps: 100
    noise_std: 0.001
    # Benchmark-specific save paths (dynamically replaces {shape} and {beta}): the latent
    # ground truth is encoded with one VAE, so every beta_scale gets its own file
    benchmark_dir: './benchmark/data/lasa_{shape}_beta_scale_{beta}'
    gt_data: './benchmark/data/lasa_{shape}_beta_scale_{beta}/ground_truth_{bm_mode}.pt'
    save_dir_node_processed: './node/data/{shape}_beta_scale_{beta}_processed'

frameworks:
  graph:
    axis_points: 100
    graph_size: 100                # nodes per axis over the configured latent_frame (sets the node spacing)
    toy:
      latent_frame: 10
    lasa:
      latent_frame: 15
      auto_frame: true            # widen the grid to frame_margin x max |z| of the encoded benchmark data, with
      frame_margin: 1.1           #   graph_size scaled to keep the spacing (fixed [-15, 15]^2 missed 13 % of N queries)
  stochman:
    axis_points: 100
    toy:
      latent_frame: 10
    lasa:
      latent_frame: 15
  node:
    axis_points: 100
    toy:
      latent_frame: 10
      latent_dim: 2
      hidden_dim: 256
      model_dir: './models/node/toy_example'
      model_name: 'NODE_{shape}RiemannianMSE_EGI'
    lasa:
      latent_frame: 15
      model_dir: './models/node/lasa'
      model_name: 'NODE_{shape}RiemannianMSE_EGI'
      # latent_dim/hidden_dim must match node_config.yaml (the architecture the NODE was trained with)
      N:
        latent_dim: 2
        hidden_dim: 256
      Angle:
        latent_dim: 2
        hidden_dim: 512
      P:
        latent_dim: 2
        hidden_dim: 512
      Leaf_1:
        latent_dim: 2
        hidden_dim: 256
      Sine:
        latent_dim: 2
        hidden_dim: 512

# ==========================================
# TIMING (standard suite, per-query times)
# ==========================================
timing:
  single_path_device: 'cpu'     # NODE single paths are timed on CPU (on GPU, kernel-launch overhead dominates); null = --device
  cpu_threads: 1                # threads for every per-query timing on CPU (graph/stochman too with --device cpu); null = all

# ==========================================
# CLOSED-LOOP SUITES (run_benchmark.py --suite reactivity | query_noise)
# ==========================================
# Every method runs in the same simulated control loop (step 1/(T-1)): NODE takes one RK4 step of its
# field per cycle, graph/stochman follow their plan and replan on every perturbation event.
reactivity:
  seed: 0
  fraction: 0.3                 # share of the benchmark queries that get a perturbation (stratified by demo and length)
  push_mm: [1, 2, 5, 10]        # in-plane ambient push of the state; >= 5 mm puts many states off the data (stress level)
  at_fraction: [0.3, 0.5, 0.7]  # when the push / goal switch happens, as a fraction of the start-goal distance covered
  disturbance_mm: [0.2, 0.5]    # std of the in-plane ambient noise added to the state at every step
  replan_every: 10              # planners under continuous disturbance replan every N steps (counted from when the plan is available)
  replan_delay: ['none', 'continue']  # 'none': a replan takes no simulated time; 'continue': it takes floor(ms / sim_period_ms)
                                #   steps, meanwhile the robot keeps executing the old plan. Each mode is saved separately.
  sim_period_ms: 10             # one simulated step = one 100 Hz control cycle (99 steps ~ 1 s of motion)
  diverge_factor: 2             # a run stops as diverged once |z| > diverge_factor * max |z_train| (counts as a failure)
  project_z: 0.0                # LASA demos lie in z = 0 and the encoder extrapolates for z != 0 (null: keep z)
  tolerance:                    # goal success
    pos_mm: 2.0
    rot_deg: 5.0
    latent_pct: 2.0             # also the stop criterion of a rollout (% of the latent span)
  max_steps_factor: 3           # a rollout stops at the goal tolerance, after 3 (T-1) steps at the latest ...
  max_budget_factor: 10         #   cycles spent waiting for a replan extend that budget, up to 10 (T-1) cycles in all
  patience: 10                  # ... or when the state has stopped moving (step < stall_pct) for 10 steps
  stall_pct: 0.01               # % of the latent span per step
  recover_band_pct: 1.0         # a pushed run has recovered once it is within 1 % of the latent span of the unperturbed run
  control_periods_ms: [1, 10]   # 1 kHz and 100 Hz control: missed cycles and deadline misses
  timing_device: 'cpu'          # NODE control cycles are timed on CPU (single queries are faster there)
  cpu_threads: 1
  query_noise:
    fraction: 1.0               # all benchmark queries
    apply_to: ['start', 'goal', 'both']
    levels: [[0.5, 0.1], [1, 0.25], [2, 0.5], [5, 1.0]]   # [position mm, rotation deg]; last level = off-data stress test
